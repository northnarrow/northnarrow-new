# Installed by NorthNarrow install.sh --cow-guard (lab PR 222, EXPERIMENTAL).
# The copy-on-first-write guard takes fanotify permission events
# (FAN_OPEN_PERM): fanotify_init with a content class needs CAP_SYS_ADMIN.
# A restore recreates a deleted file with its owner and modification time
# (CAP_CHOWN, CAP_FOWNER). CapabilityBoundingSet= lines merge, so this ADDS
# these to the unit's minimal set. The guard itself stays off until a signed
# /etc/northnarrow/cow-guard.local says `enabled = true`. Remove this file
# (and run `systemctl daemon-reload`) to keep the narrower set.
[Service]
CapabilityBoundingSet=CAP_SYS_ADMIN CAP_CHOWN CAP_FOWNER
