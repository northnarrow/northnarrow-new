[package]
name = "northnarrow-agent-ebpf"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/northnarrow/northnarrow-new"
authors = ["NorthNarrow"]
description = "NorthNarrow eBPF programs (no_std, target bpfel-unknown-none). NOT a workspace member."

[[bin]]
name = "northnarrow-agent-ebpf"
path = "src/main.rs"

# Deliberately NOT a workspace member: this crate uses a different
# toolchain (nightly + rust-src) and a different target
# (bpfel-unknown-none). See agent-ebpf/rust-toolchain.toml and
# agent-ebpf/.cargo/config.toml. The xtask runner builds it.

[dependencies]
aya-ebpf = "0.2"
northnarrow-common = { path = "../common", default-features = false }

[profile.dev]
opt-level = 3
# External audit EBPF-022: debug info is what bpf-linker turns into the
# `.BTF` section the LSM loader requires. `.cargo/config.toml` passes
# `-C debuginfo=2` too; the profile says the same instead of `false`, and
# `cargo xtask build-ebpf` refuses an object without `.BTF`.
debug = 2
debug-assertions = false
overflow-checks = false
lto = "thin"
panic = "abort"
incremental = false
codegen-units = 1
rpath = false

[profile.release]
opt-level = 3
# See [profile.dev] (external audit EBPF-022).
debug = 2
debug-assertions = false
overflow-checks = false
lto = "thin"
panic = "abort"
incremental = false
codegen-units = 1
rpath = false

[workspace]
# Sub-workspace: explicitly empty. Prevents the parent Cargo.toml from
# trying to share workspace settings (different toolchain + target).
