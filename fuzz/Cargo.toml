# cargo-fuzz targets for the agent's parsers (ROADMAP Tappa 10.8).
# Standalone package (excluded from the root workspace: libFuzzer needs
# nightly and -Zsanitizer). Run: `cargo +nightly fuzz run <target>` from
# the repository root; see fuzz/README.md.
[package]
name = "northnarrow-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
northnarrow-agent = { path = "../agent" }
northnarrow-common = { path = "../common" }
# Already in the agent's graph, at the versions fuzz/Cargo.lock locks
# (xtask/tests/supply_chain.rs keeps the security crates equal to
# Cargo.lock): the targets' own checks (serde_json), and their one
# scratch directory per process (tempfile, libc; external audit WDG-R09).
serde_json = "1"
tempfile = "3"
libc = "0.2"

[workspace]

[profile.release]
debug = 1

[[bin]]
name = "admin_frame"
path = "fuzz_targets/admin_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tls_client_hello"
path = "fuzz_targets/tls_client_hello.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dns_records"
