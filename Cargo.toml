[workspace]
resolver = "2"
members = ["agent", "antitamper-bpf", "common", "cli", "ebpf-guard", "scan", "watchdog", "xtask"]
# `agent-ebpf` is a separate cargo project: nightly toolchain,
# bpfel-unknown-none target, build-std=core. The xtask runner builds it.
exclude = ["agent-ebpf", "fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2021"
# External audit SUP-015: the oldest rustc that builds this workspace with
# the committed Cargo.lock. It was "1.83", which no build could meet:
# uuid 1.28.0 declares 1.89 (and time 0.3.47, 1.88, until it left with
# tantivy and the LLM advisor in Wave 4). Checked by
# the `msrv` CI job (`cargo +<this> check --workspace --all-targets
# --locked`) and by xtask/tests/supply_chain.rs (not below the highest
# `rust-version` of the locked dependencies, not above rust-toolchain.toml).
# A dependency bump that needs a newer rustc raises it in the same PR.
rust-version = "1.89"
# External audit SUP-019: the licence of NorthNarrow's own code, the one of
# `LICENSE`; every member inherits it, and agent-ebpf/Cargo.toml and the .rpm
# (`License:`) say the same. NOTICES.md says which files are under which
# terms (the third-party material of the on-host LLM advisor, removed in
# Wave 4 with lab PR 214, went with it). xtask/tests/compliance_docs.rs
# checks that these agree.
license = "Apache-2.0"
repository = "https://github.com/northnarrow/northnarrow-new"
authors = ["NorthNarrow"]

[workspace.dependencies]
common = { package = "northnarrow-common", path = "common" }
antitamper-bpf = { package = "northnarrow-antitamper-bpf", path = "antitamper-bpf" }

tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
bytemuck = { version = "1", features = ["derive"] }

# eBPF userland
aya = "0.14"
aya-log = "0.2"

[profile.release]
# Sub-tappa 6.8 bumped LTO from "thin" to "fat" for the on-host LLM
# advisor's CPU kernels (candle); the advisor was removed in Wave 4 (lab
# PR 214). Fat LTO is kept: cross-crate inlining still applies to the
# rest of the agent, and without candle the link is short.
opt-level = 3
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"

# Same as `release` but keeps debug symbols so `perf record` / flame
# graphs can name the agent's functions. Built explicitly with
# `cargo build --profile release-bench`.
[profile.release-bench]
inherits = "release"
debug = true
strip = "none"
