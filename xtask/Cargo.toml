[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Workspace task runner: drives the eBPF build (separate toolchain) and the userland build/run."
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
aya-obj = "0.2"
# Shared eBPF-object provenance logic. xtask writes the build stamp;
# agent/build.rs verifies it. Same crate on both sides so the hash is
# computed identically (see ebpf-guard crate docs).
ebpf-guard = { path = "../ebpf-guard" }

[dev-dependencies]
# The tests' own parsers and clock: JSON fixtures of the lab records, the
# committed workflow files (YAML), the dates of the advisory exceptions,
# of security.txt and of the install stamps. (ureq, serde, sha2, flate2 and tar, and
# these three as normal dependencies, served `cargo xtask rag-kb`, the LLM
# advisor's knowledge base, removed in Wave 4 with lab PR 214.)
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# serde_yaml (dtolnay) was archived 2024-11; serde_yaml_ng is the
# actively-maintained drop-in fork (owner ruling, 2026-05-17).
serde_yaml_ng = "0.10"
