[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Workspace task runner: drives the eBPF build (separate toolchain) and the userland build/run."
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
aya-obj = "0.5"
# Shared eBPF-object provenance logic. xtask writes the build stamp;
# agent/build.rs verifies it. Same crate on both sides so the hash is
# computed identically (see ebpf-guard crate docs).
ebpf-guard = { path = "../ebpf-guard" }
# `cargo xtask gate-summary` / `gate-report` (lab PR 227): gate-summary.json
# written and read back, with the time it was made. All three were already
# in Cargo.lock (the agent's); no new crate.
serde = { workspace = true }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
# The tests' own parser of the committed workflow files (YAML); JSON and
# the clock come from the dependencies above (the lab records' fixtures,
# the dates of the advisory exceptions, of security.txt and of the install
# stamps).
# serde_yaml (dtolnay) was archived 2024-11; serde_yaml_ng is the
# actively-maintained drop-in fork (owner ruling, 2026-05-17).
serde_yaml_ng = "0.10"

[lints]
workspace = true
