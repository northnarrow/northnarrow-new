name: Detection gap
description: Something the agent should have recorded and did not, shown with a harmless reproduction.
title: "[detection gap] <what was not recorded>"
labels: ["detection-gap", "alpha"]
body:
  - type: markdown
    attributes:
      value: |
        A detection gap is welcome here only with a **harmless** reproduction: no real malware, nothing that leaves the test machine, nothing that harms a third party. A way to stop, blind or get around the agent's self-protection is a vulnerability: report it privately (Security → Report a vulnerability), not here.
        Check `docs/operator/KNOWN_LIMITATIONS.md` (Detection coverage) first: some gaps are known.
  - type: dropdown
    id: kind
    attributes:
      label: What did not fire
      options:
        - A scenario of the alpha tester guide, section 6
        - A rule of the rule catalogue, reproduced as its "How to test" says
        - A technique not covered by any rule
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: The record you expected
      description: The rule id (if any), or the ATT&CK technique.
      placeholder: "NN-L-FIM-009_SystemdUnitDropped, or T1543.002"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Harmless reproduction
      description: The exact commands, as your normal user unless they say sudo, and how long you waited before reading the records.
      render: sh
    validations:
      required: true
  - type: textarea
    id: seen
    attributes:
      label: What was recorded instead
      description: The output of `nn-admin detections --key <key> --since <time>` (or "nothing"), and the summary lines of `nn-admin status --key <key>`, redacted.
      render: text
  - type: input
    id: release
    attributes:
      label: Release, distribution and kernel
      description: "The release (`0.1.1-alpha`, `0.1.0-alpha`, or a build of `main` with its commit) and how you installed it, `PRETTY_NAME` from `/etc/os-release` and `uname -r`."
      placeholder: "0.1.1-alpha (.deb), Ubuntu 26.04, 7.0.0-12-generic"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The reproduction is harmless and stays on my test machine.
          required: true
        - label: It is not listed in KNOWN_LIMITATIONS.md.
          required: true
        - label: I removed personal data, keys and credentials from what I attached.
          required: true
