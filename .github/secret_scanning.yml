# GitHub secret scanning: the paths whose secrets raise no alert (lot 1.8,
# the review of #610). Only nn-export's test PKI: the private keys of its
# tests' TLS receivers, published on purpose, each headed "TEST-ONLY KEY,
# NOT A SECRET" (crates/nn-export/tests/pki/README.md). Nothing else is
# excluded: xtask/tests/supply_chain.rs keeps this list to that directory,
# and every tracked PEM private key inside it.
paths-ignore:
  - "crates/nn-export/tests/pki/**"
