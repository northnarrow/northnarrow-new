# Dependabot — weekly, grouped, low-noise.
# Security advisories (RustSEC / GHSA) still open a PR immediately,
# regardless of the schedule below.
version: 2
updates:
  # Lab PR 237: the fuzz lockfile moves with the root one, so a grouped
  # bump does not leave security_crates_are_locked_alike_for_the_fuzzer
  # red (#413 had to be redone by hand in cc6ac72).
  - package-ecosystem: cargo
    directories: ["/", "/fuzz"]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for all patch/minor bumps so the lockfile churn lands
      # together and CI runs once.
      rust-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: cargo
    directory: /agent-ebpf
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    ignore:
      # Lab PR 233: aya-build 0.2.1 needs rustc 1.98; the eBPF nightly is
      # 1.93. It moves with the nightly and bpf-linker, by hand.
      - dependency-name: aya-build
        versions: [">= 0.2.1"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # External audit SUP-015: rust-toolchain.toml pins a release; this
  # proposes the next one as a PR of its own (new lints and codegen land
  # reviewed). Root only: agent-ebpf's dated nightly moves with bpf-linker
  # and is bumped by hand.
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: monthly
