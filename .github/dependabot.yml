# Dependabot — weekly, grouped, low-noise.
# Security advisories (RustSEC / GHSA) still open a PR immediately,
# regardless of the schedule below.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for all patch/minor bumps so the lockfile churn lands
      # together and CI runs once.
      rust-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: cargo
    directory: /agent-ebpf
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # External audit SUP-015: rust-toolchain.toml pins a release; this
  # proposes the next one as a PR of its own (new lints and codegen land
  # reviewed). Root only: agent-ebpf's dated nightly moves with bpf-linker
  # and is bumped by hand.
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: monthly
