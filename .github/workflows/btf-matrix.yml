# Computed kernel-compatibility matrix (multi-kernel, level 2).
#
# `deploy/btf-matrix/run.sh` downloads the BTF blob pinned for each
# distro/version (the newest non-cloud kernel of the BTFHub archive at the
# pinned commit) and asks
# `northnarrow-agent --btf-check` for a verdict — no root, no eBPF load,
# so it runs on the hosted runner. The run fails when a verdict is worse
# than `deploy/btf-matrix/expected.tsv` (a struct-offset regression) or a
# BTF cannot be parsed (a parser regression). The agent is built WITHOUT
# the eBPF object (build.rs placeholder): --btf-check never needs it.
#
# Kernels with native BTF (5.15 / 6.1 / 6.8) are not in BTFHub; the lab
# guests cover them (docs/operator/KERNEL_COMPATIBILITY.md).
#
# External audit SUP-014: the blobs are pinned (deploy/btf-matrix/blobs.sha256:
# an archive commit and the sha256 of each archive), so the run downloads
# nothing from the archive's moving branch, needs no token (no API call),
# and a cached blob is checked again before use. A bump is a PR made with
# `deploy/btf-matrix/run.sh --refresh`.
name: BTF matrix

on:
  pull_request:
    branches: [main]
    paths:
      - common/src/btf_offsets.rs
      - crates/nn-linux/src/anti_tamper/btf_revalidate.rs
      - agent/src/boot/mod.rs
      - agent/src/boot/preflight.rs
      - deploy/btf-matrix/**
      - .github/workflows/btf-matrix.yml
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC — the archive grows, the baseline must keep holding
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  matrix:
    name: btf-matrix (BTFHub)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # A target-cpu=native build poisons the cached target dir on a hosted
      # runner: a proc-macro dylib (bytemuck_derive) built on a newer CPU is
      # restored on an older one and rustc dies with SIGILL on every run until
      # the cache key rotates. x86-64-v2, the floor of every GitHub runner, is
      # also the .cargo/config.toml default since external audit SUP-017; it
      # stays explicit here so a later change of that default cannot bring
      # the poisoned cache back.
      RUSTFLAGS: -C target-cpu=x86-64-v2
    steps:
      # External audit SUP-004: the token is not left in .git/config for
      # the build scripts of the dependency tree (run.sh gets it from env).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # External audit SUP-015: the pinned release of rust-toolchain.toml.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-btf-matrix-v2-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-btf-matrix-v2-

      # SUP-013, SUP-014, SUP-021: run.sh's own cases, offline (stub curl,
      # gh and agent, a local directory as the archive), before it is trusted
      # with the matrix. The CI test job runs them too (xtask supply_chain).
      - name: run.sh self-test (offline)
        run: deploy/btf-matrix/run-test.sh

      - name: Prune workspace crates from the restored cache
        run: |
          .github/scripts/prune-workspace-cache.sh target

      - name: Build the agent (no eBPF object needed for --btf-check)
        # External audit SUP-016: --locked, the build of Cargo.lock as committed.
        run: cargo build --release --locked -p northnarrow-agent

      # SUP-014: the cache holds the pinned archives only, keyed by the pin
      # file and never restored from another key: a bump starts empty, and
      # run.sh checks every cached archive against its pin anyway.
      - name: Cache BTFHub blobs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/nn-btf-matrix
          key: btfhub-blobs-v2-${{ hashFiles('deploy/btf-matrix/blobs.sha256') }}

      # SUP-021: no token in this step. The pinned blobs come from
      # raw.githubusercontent.com at a commit; only `run.sh --refresh` (a
      # maintainer's command for a bump PR) calls the GitHub API.
      - name: Compute the matrix
        run: deploy/btf-matrix/run.sh --out target/btf-matrix/matrix.md

      - name: Publish the matrix in the job summary
        if: always()
        run: |
          if [ -f target/btf-matrix/matrix.md ]; then
            cat target/btf-matrix/matrix.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "matrix not produced (see the step log)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the matrix
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: btf-matrix
          path: target/btf-matrix/matrix.md
          if-no-files-found: ignore
