# Kani model checking (Tappa 10.8, "verifica formale dopo il fuzzing").
#
# The fuzz job samples the input space of the parsers that read
# attacker-written bytes; these proofs cover all of it for the
# bounds-checking cores those parsers are built on:
#   - nn_parse::tls::Cursor — every ClientHello read goes through it
#     (any buffer ≤ 8 bytes, any position, any length: no panic, the
#     position never leaves the buffer; by induction any read sequence);
#   - dns_qname::QnameLabels — the DNS name walk behind decode_dns_qname
#     (any buffer ≤ 16 bytes: in bounds, terminates), and qname_wire_end
#     (the end it reports is just past a root label);
#   - admin_quorum::quorum_decision — the admin multi-signature rule.
# Weekly, on demand, and (external audit SUP-023) on every pull request
# that touches a proved file: a PR that weakened a bound merged with the
# proof red until the next Monday. The filter names the files that hold
# the proved code (xtask/tests/supply_chain.rs keeps it equal to the files
# with a #[kani::proof], and every harness run below); the DNS walk has
# its own module so that edits to the event model do not start it.
name: kani

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - crates/nn-parse/src/tls.rs
      - crates/nn-proto/src/admin_quorum.rs
      - crates/nn-parse/src/dns_qname.rs
      - .github/workflows/kani.yml

# A newer push to the same pull request supersedes a run in progress.
concurrency:
  group: kani-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# External audit SUP-004: a read-only token, not left in .git/config.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Same as the .cargo/config.toml default since external audit SUP-017;
  # kept explicit. Irrelevant for proofs.
  RUSTFLAGS: -C target-cpu=x86-64-v2

jobs:
  proofs:
    name: kani (model checking)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # External audit SUP-015/SUP-016: the pinned userland release
      # (rust-toolchain.toml) builds kani-verifier; `cargo kani` has no
      # --locked, so Cargo.lock is checked against the manifests first and
      # must be unchanged after the proofs.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Lockfile is authoritative
        run: cargo fetch --locked

      - name: Install Kani (pinned)
        run: |
          cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup

      - name: Prove the DNS label walk (nn-parse)
        run: cargo kani -p nn-parse --harness qname_label_walk_is_in_bounds_and_terminates

      - name: Prove the end of a DNS name (nn-parse)
        run: cargo kani -p nn-parse --harness qname_wire_end_is_past_a_root_label

      - name: Prove the TLS cursor (nn-parse)
        # R06 (lab PR 242): the parser left the agent for nn-parse, and the
        # proof with it. `--ignore-global-asm` was the agent's (a Candle
        # dependency, pulp, carried global asm Kani cannot model; it left
        # with the LLM advisor, lab PR 214): nn-parse's graph (md-5, sha2,
        # hex) needs no flag.
        run: >
          cargo kani -p nn-parse
          --harness cursor_operations_never_panic_and_keep_pos_in_bounds

      - name: Prove the admin quorum rule (nn-proto, shared by agent and watchdog)
        run: >
          cargo kani -p nn-proto
          --harness quorum_accepts_only_enough_distinct_keys_carrying_every_role

      - name: No lockfile changed during the proofs
        run: git diff --exit-code -- Cargo.lock
