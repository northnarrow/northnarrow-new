name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  userland:
    name: ${{ matrix.task }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        task: [fmt, clippy, build, test]

    steps:
      - uses: actions/checkout@v7

      # Free runner disk. The cached `target/` trees (one per job key)
      # plus the candle/gemm build artefacts have pushed the 14 GB
      # ubuntu-latest root volume to ENOSPC ("No space left on device"
      # in the ade-build job, June 2026). The preinstalled toolchains
      # below are never used by this workspace and free ~25 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.task }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.task }}-
            ${{ runner.os }}-cargo-

      - name: Prune workspace crates from the restored cache
        run: |
          .github/scripts/prune-workspace-cache.sh target

      - name: cargo fmt --all --check
        if: matrix.task == 'fmt'
        run: cargo fmt --all --check

      - name: cargo clippy --workspace --exclude northnarrow-agent-ebpf --all-targets -- -D warnings
        if: matrix.task == 'clippy'
        run: cargo clippy --workspace --exclude northnarrow-agent-ebpf --all-targets -- -D warnings

      - name: cargo build --workspace
        if: matrix.task == 'build'
        run: cargo build --workspace --exclude northnarrow-agent-ebpf --verbose

      - name: cargo test --workspace
        # Integration tests that need root are #[ignore]d, so the
        # default `cargo test` run is unprivileged.
        if: matrix.task == 'test'
        run: cargo test --workspace --exclude northnarrow-agent-ebpf --verbose

  test-privileged:
    name: test-privileged (compile-only)
    runs-on: ubuntu-latest
    # Tappa 3 ships ignored integration tests that actually kill
    # processes (need root or CAP_KILL). CI cannot run them, but it
    # still verifies they compile so they can never silently rot.
    steps:
      - uses: actions/checkout@v7

      # Free runner disk. The cached `target/` trees (one per job key)
      # plus the candle/gemm build artefacts have pushed the 14 GB
      # ubuntu-latest root volume to ENOSPC ("No space left on device"
      # in the ade-build job, June 2026). The preinstalled toolchains
      # below are never used by this workspace and free ~25 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-privileged-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-privileged-
            ${{ runner.os }}-cargo-

      - name: Prune workspace crates from the restored cache
        run: |
          .github/scripts/prune-workspace-cache.sh target

      - name: Compile workspace tests (including ignored)
        run: cargo test --workspace --no-run --verbose

      # Tappa 7 task 7 / Tappa 8: agent/tests/privileged_e2e.rs is gated
      # behind --features test-privileged. Running it needs root +
      # iptables (see docs/integration-test-runbook.md), so CI compiles
      # without executing — same bit-rot guard pattern as the rest of
      # this job.
      - name: Compile privileged_e2e module (test-privileged)
        run: cargo test --workspace --no-run --features northnarrow-agent/test-privileged,northnarrow-agent/debug-trigger --verbose

  ade-build:
    # Tappa 6 — verifies the ADE module compiles cleanly without
    # ever pulling a GGUF model or any C++ dependency. The default
    # `MockBackend` is the only backend on the build path.
    name: ade-build (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Free runner disk. The cached `target/` trees (one per job key)
      # plus the candle/gemm build artefacts have pushed the 14 GB
      # ubuntu-latest root volume to ENOSPC ("No space left on device"
      # in the ade-build job, June 2026). The preinstalled toolchains
      # below are never used by this workspace and free ~25 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install stable --profile minimal
          rustup component add clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ade-build-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ade-build-
            ${{ runner.os }}-cargo-

      - name: Prune workspace crates from the restored cache
        run: |
          .github/scripts/prune-workspace-cache.sh target

      - name: cargo build (ADE module)
        run: cargo build -p northnarrow-agent --lib --verbose

      - name: cargo clippy (ADE-touched crates)
        run: cargo clippy -p northnarrow-agent -p northnarrow-common --all-targets -- -D warnings

  ade-unit-test:
    # Tappa 6 — runs every ADE unit test (parser validation, escalate
    # transform, prompt builder, mock backend, engine end-to-end with
    # mocks). NEVER downloads a model and NEVER hits the network.
    name: ade-unit-test (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Free runner disk. The cached `target/` trees (one per job key)
      # plus the candle/gemm build artefacts have pushed the 14 GB
      # ubuntu-latest root volume to ENOSPC ("No space left on device"
      # in the ade-build job, June 2026). The preinstalled toolchains
      # below are never used by this workspace and free ~25 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install stable --profile minimal

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ade-test-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ade-test-
            ${{ runner.os }}-cargo-

      - name: Prune workspace crates from the restored cache
        run: |
          .github/scripts/prune-workspace-cache.sh target

      - name: cargo test (ADE + correlation + ade_types)
        run: |
          cargo test -p northnarrow-agent --lib ade::
          cargo test -p northnarrow-agent --lib correlation::
          cargo test -p northnarrow-common --lib ade_types::

  ebpf-build:
    name: ebpf-build (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Free runner disk. The cached `target/` trees (one per job key)
      # plus the candle/gemm build artefacts have pushed the 14 GB
      # ubuntu-latest root volume to ENOSPC ("No space left on device"
      # in the ade-build job, June 2026). The preinstalled toolchains
      # below are never used by this workspace and free ~25 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h / | tail -1

      # No system LLVM: bpf-linker 0.10.x links against rustc's own
      # bundled LLVM through aya-rustc-llvm-proxy (default feature
      # `rust-llvm-22`, `no-llvm-linking`), so the apt llvm-dev that
      # used to be installed here was never used. Keep the version
      # PINNED: 0.11.0 dropped the proxy and needs a system LLVM 21+
      # (`-lLLVM` link failure on ubuntu-24.04, which ships LLVM 18).
      # 0.10.3 is also the version the reference lab runs
      # (docs/CLAUDE_BRIEFING.md).
      - name: Install nightly Rust + rust-src for build-std
        # Same channel as agent-ebpf/rust-toolchain.toml, so rustup
        # does not have to download it again at build time.
        run: |
          rustup toolchain install nightly-2025-12-01 --profile minimal --component rust-src
          rustup default stable

      - name: Install bpf-linker (pinned)
        run: cargo install bpf-linker --version 0.10.3 --locked

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            agent-ebpf/target
          key: ${{ runner.os }}-cargo-ebpf-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ebpf-

      - name: Prune workspace crates from the restored cache
        run: |
          .github/scripts/prune-workspace-cache.sh target
          (cd agent-ebpf && ../.github/scripts/prune-workspace-cache.sh target)

      - name: cargo xtask build-ebpf
        run: cargo xtask build-ebpf

      - name: Verify eBPF object exists
        run: |
          test -f agent-ebpf/target/bpfel-unknown-none/release/northnarrow-agent-ebpf
          file agent-ebpf/target/bpfel-unknown-none/release/northnarrow-agent-ebpf

  fuzz:
    name: fuzz (smoke, nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h / | tail -1

      # libFuzzer needs nightly (-Zsanitizer); the same channel as the eBPF
      # build so one toolchain download serves both.
      - name: Install nightly toolchain + cargo-fuzz
        run: |
          rustup toolchain install nightly-2025-12-01 --profile minimal
          cargo install cargo-fuzz --locked

      - name: Cache cargo registry and fuzz target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fuzz-

      - name: Prune workspace crates from the restored cache
        run: |
          .github/scripts/prune-workspace-cache.sh target
          (cd fuzz && ../.github/scripts/prune-workspace-cache.sh target)

      # Every target must build; each then runs a short smoke so a
      # trivially reachable panic fails the PR. Long campaigns run from a
      # developer host (fuzz/README.md).
      - name: Build and smoke every fuzz target
        run: |
          set -euo pipefail
          cargo +nightly-2025-12-01 fuzz build
          # Run the built binaries directly: `cargo fuzz run` re-invokes
          # cargo, and agent/build.rs re-runs whenever .git/refs changes.
          for t in $(cargo +nightly-2025-12-01 fuzz list); do
            echo "::group::$t"
            mkdir -p "fuzz/corpus/$t" "fuzz/artifacts/$t"
            "fuzz/target/x86_64-unknown-linux-gnu/release/$t" -max_total_time=20 -max_len=8192 \
              -artifact_prefix="fuzz/artifacts/$t/" "fuzz/corpus/$t" 2>&1 | tail -3
            echo "::endgroup::"
          done
          if ls fuzz/artifacts/*/crash-* >/dev/null 2>&1; then
            echo "fuzz: crash artefacts found"; ls -la fuzz/artifacts/*; exit 1
          fi

  audit:
    # RustSEC advisory gate. Fails on a vulnerability;
    # `unmaintained`/`unsound` warnings are reported but do not fail the
    # job (they are tracked by dependabot).
    name: cargo audit (ubuntu-latest)
    runs-on: ubuntu-latest
    # cargo-audit itself, not rustsec/audit-check: the action reported
    # its result through the checks API and, since 2026-10-13, failed PR
    # runs that had found nothing — "Not Found" updating its own check
    # run. The job's exit status is the gate; the token needs no write.
    # External audit SUP-006: every lockfile is audited — the fuzz
    # harness and the eBPF crate have their own.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit Cargo.lock, fuzz/Cargo.lock, agent-ebpf/Cargo.lock
        run: |
          rc=0
          for lock in Cargo.lock fuzz/Cargo.lock agent-ebpf/Cargo.lock; do
            echo "::group::cargo audit --file $lock"
            cargo audit --file "$lock" || rc=1
            echo "::endgroup::"
          done
          exit $rc
      # External audit MAIN-006: no C in production (VISION_TECHNICAL.md,
      # rule 1), checked rather than stated. Oniguruma (`onig_sys`, through
      # tokenizers' `onig` feature) and zstd (`zstd-sys`, through tantivy's
      # default features) are the C libraries the agent has pulled in or
      # nearly did; neither may be in its normal dependency graph, for any
      # target or feature. The listing is matched, not `cargo tree -i`'s
      # exit status: that fails both for a crate outside the graph and for
      # any other error, so a gate on it would pass when cargo cannot run.
      - name: "Charter: no onig_sys or zstd-sys in the agent's dependency graph"
        run: |
          set -euo pipefail
          deps=$(cargo tree --locked -p northnarrow-agent -e normal --all-features \
            --target all --prefix none --format '{p}' | sort -u)
          bad=$(printf '%s\n' "$deps" | awk '$1 == "onig_sys" || $1 == "zstd-sys"')
          if [ -n "$bad" ]; then
            echo "::error::C library crate in the agent's dependency graph: $bad"
            for c in $(printf '%s\n' "$bad" | awk '{print $1}' | sort -u); do
              cargo tree --locked -p northnarrow-agent -e normal --all-features \
                --target all -i "$c"
            done
            exit 1
          fi
          echo "onig_sys, zstd-sys: absent ($(printf '%s\n' "$deps" | wc -l) packages checked)"
