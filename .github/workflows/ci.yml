name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # External audit SUP-006 (residual): a new RustSEC advisory against an
  # unchanged main is reported the next morning, not at the next push.
  # The schedule runs the audit job only; every other job is skipped.
  schedule:
    - cron: "23 5 * * *"

# External audit SUP-004: the token of every job reads the repository and
# nothing else. No job here writes to it (the audit gate is its exit
# status), and no checkout leaves the token in .git/config, where the build
# scripts and proc-macros of the dependency tree could read it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# External audit SUP-002: every action is pinned by commit SHA (the version
# in the comment); Dependabot (github-actions) proposes updates. Every
# `cargo install` names a version and --locked. xtask/tests/supply_chain.rs
# (the test job) fails on a tag-pinned action or an unpinned tool.

jobs:
  userland:
    name: ${{ matrix.task }} (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        task: [fmt, clippy, build, test]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Free runner disk. The cached `target/` trees (one per job key)
      # plus the build artefacts of the LLM advisor (candle/gemm, removed
      # in Wave 4) pushed the 14 GB ubuntu-latest root volume to ENOSPC
      # ("No space left on device", June 2026). The preinstalled
      # toolchains below are never used by this workspace and free ~25 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Install Rust toolchain
        # rust-toolchain.toml: the pinned release with rustfmt and clippy
        # (external audit SUP-015). No argument: rustup reads the file.
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.task }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.task }}-

      - name: Prune workspace crates from the restored cache
        run: |
          .github/scripts/prune-workspace-cache.sh target

      - name: cargo fmt --all --check
        if: matrix.task == 'fmt'
        run: cargo fmt --all --check

      # External audit SUP-016: every cargo build, test, clippy and check
      # here is --locked. A manifest change without its Cargo.lock fails
      # ("cannot update the lock file … because --locked was passed")
      # instead of being resolved again on the runner, from whatever the
      # registry serves that day.
      - name: cargo clippy --workspace --exclude northnarrow-agent-ebpf --all-targets -- -D warnings
        if: matrix.task == 'clippy'
        run: cargo clippy --workspace --exclude northnarrow-agent-ebpf --all-targets --locked -- -D warnings

      # External audit POS-013: the posture demo needs the `posture-demo`
      # feature (`required-features`), so the run above skips it; keep it
      # building.
      - name: cargo clippy --example posture_demo --features posture-demo
        if: matrix.task == 'clippy'
        run: cargo clippy --locked -p northnarrow-agent --example posture_demo --features posture-demo -- -D warnings

      - name: cargo build --workspace
        if: matrix.task == 'build'
        run: cargo build --workspace --exclude northnarrow-agent-ebpf --locked --verbose

      - name: cargo test --workspace
        # Integration tests that need root are #[ignore]d, so the
        # default `cargo test` run is unprivileged.
        if: matrix.task == 'test'
        run: cargo test --workspace --exclude northnarrow-agent-ebpf --locked --verbose

  portable-core:
    # Wave 4 restructure, R01 (lab PR 239): the pure crates of
    # docs/architecture/module-map.toml — the core the plan builds for six
    # targets, no OS interface — checked for the five other than x86_64
    # Linux (every other job's): aarch64 Linux, Windows and macOS on x86_64
    # and aarch64. `cargo check` needs the target's standard library only:
    # no linker, no SDK. The crates are empty until R02; the job holds them
    # to it from their first line. xtask/tests/workspace_layers.rs keeps
    # the -p list equal to the pure crates of the map, and the targets.
    name: portable-core (aarch64 Linux, Windows, macOS)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain and the targets
        # rust-toolchain.toml's release (SUP-015), with the standard library
        # of each target.
        run: |
          rustup toolchain install
          rustup target add aarch64-unknown-linux-gnu x86_64-pc-windows-msvc \
            aarch64-pc-windows-msvc x86_64-apple-darwin aarch64-apple-darwin
          rustup show active-toolchain

      - name: cargo check the pure crates for each target
        run: |
          set -euo pipefail
          for t in aarch64-unknown-linux-gnu x86_64-pc-windows-msvc \
                   aarch64-pc-windows-msvc x86_64-apple-darwin aarch64-apple-darwin; do
            echo "::group::$t"
            cargo check --locked --target "$t" \
              -p nn-parse -p nn-model -p nn-proto -p nn-evidence -p nn-core
            echo "::endgroup::"
          done

  test-privileged:
    name: test-privileged (compile-only)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # Tappa 3 ships ignored integration tests that actually kill
    # processes (need root or CAP_KILL). This job cannot run them (no
    # root, no BPF-LSM on the runner's kernel), but it still verifies they
    # compile on every push so they can never silently rot; lab-vm.yml
    # runs them in KVM guests (lab PR 227).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Free runner disk. The cached `target/` trees (one per job key)
      # plus the build artefacts of the LLM advisor (candle/gemm, removed
      # in Wave 4) pushed the 14 GB ubuntu-latest root volume to ENOSPC
      # ("No space left on device", June 2026). The preinstalled
      # toolchains below are never used by this workspace and free ~25 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Install Rust toolchain
        # rust-toolchain.toml: the pinned release with rustfmt and clippy
        # (external audit SUP-015). No argument: rustup reads the file.
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-privileged-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-privileged-

      - name: Prune workspace crates from the restored cache
        run: |
          .github/scripts/prune-workspace-cache.sh target

      - name: Compile workspace tests (including ignored)
        run: cargo test --workspace --no-run --locked --verbose

      # Tappa 7 task 7 / Tappa 8: agent/tests/privileged_e2e.rs is gated
      # behind --features test-privileged. Running it needs root +
      # iptables (see docs/integration-test-runbook.md), so this job
      # compiles without executing — same bit-rot guard pattern as the
      # rest of this job; lab-vm.yml executes it.
      - name: Compile privileged_e2e module (test-privileged)
        run: cargo test --workspace --no-run --locked --features northnarrow-agent/test-privileged,northnarrow-agent/debug-trigger --verbose

      # External audit ASK-016 (lab PR 170): the wire's production
      # discriminants must not move with `debug-trigger` (a lab agent and a
      # watchdog built without it must still read each other's frames).
      # The admin protocol is nn-proto's since R03 (lab PR 240).
      - name: Wire discriminants with debug-trigger
        run: cargo test --locked -p nn-proto --features debug-trigger --lib admin_protocol

  ebpf-build:
    name: ebpf-build (ubuntu-latest)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Free runner disk. The cached `target/` trees (one per job key)
      # plus the build artefacts of the LLM advisor (candle/gemm, removed
      # in Wave 4) pushed the 14 GB ubuntu-latest root volume to ENOSPC
      # ("No space left on device", June 2026). The preinstalled
      # toolchains below are never used by this workspace and free ~25 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h / | tail -1

      # No system LLVM: bpf-linker 0.10.x links against rustc's own
      # bundled LLVM through aya-rustc-llvm-proxy (default feature
      # `rust-llvm-22`, `no-llvm-linking`), so the apt llvm-dev that
      # used to be installed here was never used. Keep the version
      # PINNED: 0.11.0 dropped the proxy and needs a system LLVM 21+
      # (`-lLLVM` link failure on ubuntu-24.04, which ships LLVM 18).
      # 0.10.3 is also the version the reference lab runs.
      - name: Install nightly Rust + rust-src for build-std
        # Same channel as agent-ebpf/rust-toolchain.toml, so rustup
        # does not have to download it again at build time.
        run: |
          rustup toolchain install nightly-2025-12-01 --profile minimal --component rust-src
          rustup toolchain install   # the pinned userland release (rust-toolchain.toml)

      - name: Install bpf-linker (pinned)
        run: cargo install bpf-linker --version 0.10.3 --locked

      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            agent-ebpf/target
          key: ${{ runner.os }}-cargo-ebpf-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ebpf-

      - name: Prune workspace crates from the restored cache
        run: |
          .github/scripts/prune-workspace-cache.sh target
          (cd agent-ebpf && ../.github/scripts/prune-workspace-cache.sh target)

      # The first --locked builds xtask itself against Cargo.lock; the
      # second is xtask's, passed on to the nested agent-ebpf build (xtask
      # clears the parent cargo's environment), so agent-ebpf/Cargo.lock
      # is held to its manifest too.
      - name: cargo xtask build-ebpf
        run: cargo --locked xtask build-ebpf --locked

      - name: Verify eBPF object exists
        run: |
          test -f agent-ebpf/target/bpfel-unknown-none/release/northnarrow-agent-ebpf
          file agent-ebpf/target/bpfel-unknown-none/release/northnarrow-agent-ebpf

      # Lab PR 219: every map of the object just built must be one the
      # agent's aya loads. The `test` job embeds no object and skips this
      # test; here NN_REQUIRE_EBPF_OBJECT makes a missing object a failure.
      # Wave 4 restructure, R09b (lab PR 254): the embed and its tests are
      # nn-linux's.
      - name: eBPF object map types (aya loader)
        env:
          NN_REQUIRE_EBPF_OBJECT: "1"
        run: cargo test --locked -p nn-linux --lib sensors::ebpf_object::tests::every_map_is_one_the_agents_aya_loads -- --exact

  fuzz:
    name: fuzz (smoke, nightly)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h / | tail -1

      # libFuzzer needs nightly (-Zsanitizer); the same channel as the eBPF
      # build so one toolchain download serves both. External audit
      # SUP-005: cargo-fuzz pinned (the version runs resolved on 2026-10-15).
      - name: Install nightly toolchain + cargo-fuzz (pinned)
        run: |
          rustup toolchain install nightly-2025-12-01 --profile minimal
          rustup toolchain install   # the pinned release builds cargo-fuzz (rust-toolchain.toml)
          cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Cache cargo registry and fuzz target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fuzz-

      - name: Prune workspace crates from the restored cache
        run: |
          .github/scripts/prune-workspace-cache.sh target
          (cd fuzz && ../.github/scripts/prune-workspace-cache.sh target)

      # cargo-fuzz has no --locked: fuzz/Cargo.lock is checked against the
      # harness's manifest (and the agent's, which it builds) first, and
      # must be unchanged after the build (external audit SUP-016).
      - name: fuzz/Cargo.lock is authoritative
        run: cd fuzz && cargo +nightly-2025-12-01 fetch --locked

      # External audit SUP-018: the working corpus carries over between
      # runs, saved under this run's id and restored from the latest one.
      # libFuzzer writes new inputs only into the first directory it is
      # given, so the committed seeds are read and never written.
      - name: Cache the fuzz corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: ${{ runner.os }}-fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-fuzz-corpus-

      # Every target must build. External audit SUP-018 / WDG-R06: every
      # committed input then replays clean (`-runs=0`): the seeds
      # (fuzz/seeds/<target>/, at least one per target, made to reach the
      # targets' assertions) and the inputs of fixed bugs
      # (fuzz/regressions/<target>/, each failing its target's assertions
      # once its fix is reverted). Each target then runs a short smoke from
      # the cached corpus and the seeds, so a reachable failure fails the
      # PR. Long campaigns run from a developer host (fuzz/README.md).
      - name: Build, replay the committed inputs, smoke every fuzz target
        run: |
          set -euo pipefail
          cargo +nightly-2025-12-01 fuzz build
          # Run the built binaries directly: `cargo fuzz run` re-invokes
          # cargo, and agent/build.rs re-runs whenever .git/refs changes.
          bin=fuzz/target/x86_64-unknown-linux-gnu/release
          failed=""
          for t in $(cargo +nightly-2025-12-01 fuzz list); do
            echo "::group::$t"
            mkdir -p "fuzz/corpus/$t" "fuzz/artifacts/$t"
            if [ ! -d "fuzz/seeds/$t" ]; then
              echo "fuzz: $t has no fuzz/seeds/$t"; failed="$failed $t(no-seeds)"
            else
              inputs=("fuzz/seeds/$t")
              if [ -d "fuzz/regressions/$t" ]; then inputs+=("fuzz/regressions/$t"); fi
              if ! "$bin/$t" -runs=0 -timeout=25 -artifact_prefix="fuzz/artifacts/$t/" \
                  "${inputs[@]}" > "fuzz/artifacts/$t/replay.log" 2>&1; then
                tail -n 40 "fuzz/artifacts/$t/replay.log"; failed="$failed $t(replay)"
              elif ! "$bin/$t" -max_total_time=20 -max_len=8192 -timeout=25 \
                  -artifact_prefix="fuzz/artifacts/$t/" "fuzz/corpus/$t" "fuzz/seeds/$t" \
                  > "fuzz/artifacts/$t/smoke.log" 2>&1; then
                tail -n 40 "fuzz/artifacts/$t/smoke.log"; failed="$failed $t(smoke)"
              else
                tail -n 3 "fuzz/artifacts/$t/smoke.log"
              fi
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "fuzz: failed:$failed"; ls -la fuzz/artifacts/*; exit 1
          fi

      - name: No lockfile changed during the build
        run: git diff --exit-code -- Cargo.lock fuzz/Cargo.lock agent-ebpf/Cargo.lock

  msrv:
    # External audit SUP-015: `rust-version` in Cargo.toml is a claim this
    # job checks. It was 1.83 while uuid 1.28.0 needed 1.89, and nothing
    # built with it. The version is read from Cargo.toml, so raising it
    # needs no edit here. No cache (a check of the workspace takes minutes,
    # and nothing restored can mark a crate fresh), and no -D warnings: the
    # claim is that this rustc builds the tree; the lints are the pinned
    # toolchain's job (clippy above).
    name: msrv (rust-version, ubuntu-latest)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C target-cpu=x86-64-v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain of rust-version
        run: |
          set -euo pipefail
          msrv=$(sed -n 's/^rust-version = "\([0-9.]*\)"$/\1/p' Cargo.toml)
          [ -n "$msrv" ] || { echo "::error::no rust-version in Cargo.toml"; exit 1; }
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"

      - name: cargo +rust-version check --workspace --all-targets --locked
        run: cargo +"$MSRV" check --workspace --all-targets --locked

  audit:
    # RustSEC advisory gate. Fails on a vulnerability, and on an
    # `unsound` or `unmaintained` advisory too (external audit SUP-007:
    # they were only warnings, said to be "tracked by dependabot"; but
    # Dependabot fails no build, bumps the manifests' own dependencies and
    # has nothing to propose for an archived crate: memmap2 0.9.10, a
    # transitive one, stayed four months after its fix). An advisory that
    # cannot be fixed yet is a recorded exception in .cargo/audit.toml —
    # reason, owner, re-check, expiry — never an `--ignore` here; an
    # exception past its date fails the job. Runs on every push and pull
    # request and, alone, on the daily schedule above.
    name: cargo audit (ubuntu-latest)
    runs-on: ubuntu-latest
    # cargo-audit itself, not rustsec/audit-check: the action reported
    # its result through the checks API and, since 2026-10-13, failed PR
    # runs that had found nothing — "Not Found" updating its own check
    # run. The job's exit status is the gate; the token needs no write.
    # External audit SUP-006: every lockfile is audited — the fuzz
    # harness and the eBPF crate have their own.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-audit
        run: |
          rustup toolchain install   # the pinned release (rust-toolchain.toml)
          cargo install cargo-audit --locked --version 0.22.2
      # SUP-007: cargo-audit does not know when an exception was meant to
      # end; this step does (the `Expires:` line of each entry).
      - name: No expired advisory exception in .cargo/audit.toml
        run: .github/scripts/check-audit-exceptions.sh .cargo/audit.toml
      # From the repository root: cargo-audit reads ./.cargo/audit.toml
      # (the exceptions) relative to where it runs. The --deny flags hold
      # even if it did not.
      - name: Audit Cargo.lock, fuzz/Cargo.lock, agent-ebpf/Cargo.lock
        run: |
          rc=0
          for lock in Cargo.lock fuzz/Cargo.lock agent-ebpf/Cargo.lock; do
            echo "::group::cargo audit --file $lock"
            cargo audit --file "$lock" --deny unsound --deny unmaintained || rc=1
            echo "::endgroup::"
          done
          exit $rc
      # External audit MAIN-006: no C in production (VISION_TECHNICAL.md,
      # rule 1), checked rather than stated. Oniguruma (`onig_sys`, through
      # tokenizers' `onig` feature) and zstd (`zstd-sys`, through tantivy's
      # default features) are the C libraries the agent has pulled in or
      # nearly did; neither may be in its normal dependency graph, for any
      # target or feature. (tokenizers and tantivy left with the LLM
      # advisor in Wave 4, lab PR 214; the gate stays for whatever comes
      # next.) The listing is matched, not `cargo tree -i`'s
      # exit status: that fails both for a crate outside the graph and for
      # any other error, so a gate on it would pass when cargo cannot run.
      - name: "Charter: no onig_sys or zstd-sys in the agent's dependency graph"
        run: |
          set -euo pipefail
          deps=$(cargo tree --locked -p northnarrow-agent -e normal --all-features \
            --target all --prefix none --format '{p}' | sort -u)
          bad=$(printf '%s\n' "$deps" | awk '$1 == "onig_sys" || $1 == "zstd-sys"')
          if [ -n "$bad" ]; then
            echo "::error::C library crate in the agent's dependency graph: $bad"
            for c in $(printf '%s\n' "$bad" | awk '{print $1}' | sort -u); do
              cargo tree --locked -p northnarrow-agent -e normal --all-features \
                --target all -i "$c"
            done
            exit 1
          fi
          echo "onig_sys, zstd-sys: absent ($(printf '%s\n' "$deps" | wc -l) packages checked)"
