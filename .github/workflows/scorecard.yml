# OpenSSF Scorecard (lot M2): the repository's supply-chain checks, run by
# ossf/scorecard-action and published to api.scorecard.dev, which serves
# the README's badge and https://scorecard.dev/viewer/?uri=github.com/northnarrow/northnarrow-new.
# The workflow is scorecard-action's examples/scorecard.yml for a public
# repository (v2.6.0), with workflow_dispatch added and the pins of the
# repository's other workflows.
#
# The Scorecard API accepts a published result only from a workflow that
# keeps its rules (scorecard-action's README, "Workflow restrictions"): no
# top-level env, defaults or write permission; only the Scorecard job holds
# `id-token: write`; that job has no env, defaults, container or services,
# runs on a GitHub-hosted Ubuntu runner, and its steps are only approved
# actions, no `run:`. With `fail_on_publish_error` a rejection fails the
# run instead of a warning.
#
# The job's token: `security-events: write` uploads the SARIF to code
# scanning (alerts under Security → Code scanning, tool "Scorecard"), and
# `id-token: write` signs the published result: the API checks that the
# OIDC token was issued to this workflow of this repository. The job runs
# nothing of the tree: the scanner reads the checked-out files and the
# GitHub API. xtask/tests/supply_chain.rs keeps the triggers, the job, its
# permissions and its steps as they are, and these two write scopes to this
# job alone.
name: Scorecard supply-chain security

on:
  # For the Branch-Protection check (the default branch only).
  branch_protection_rule:
  # Keeps the Maintained check current on a quiet week.
  schedule:
    - cron: "15 14 * * 0" # Sunday 14:15 UTC, apart from the nightly lab and CodeQL runs
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# External audit SUP-004: no permission at the top; the job asks for its own.
permissions: {}
# No cache access at all (the example's setting; a key GitHub Actions added
# in September 2026).
cache-mode: none

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Scorecard supports the default branch only.
    if: ${{ github.event.repository.default_branch == github.ref_name }}
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write # sign the result published to api.scorecard.dev

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Public repository: publish, for the badge and the REST API.
          publish_results: true
          fail_on_publish_error: true

      - name: Upload artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: results.sarif
