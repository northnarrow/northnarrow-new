[package]
name = "northnarrow-common"
version.workspace = true
edition.workspace = true
# Lot 400a: not the workspace's 1.98. Two compilers build this crate: the
# workspace's (its `rust-version`, checked by the `msrv` CI job) and the
# eBPF crate's nightly (agent-ebpf/rust-toolchain.toml, rustc
# 1.93.0-nightly), which refuses a crate whose `rust-version` is above it.
# The floor is the lower of the two, checked by every eBPF build; it moves
# with the eBPF nightly (lot 400b).
rust-version = "1.93"
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The kernel↔userland ABI of the NorthNarrow EDR (raw wire layouts, BTF offsets, uapi constants, ring-drop slots) and the exec quarantine's scanner protocol."

[lib]
name = "northnarrow_common"
path = "src/lib.rs"

[features]
default = ["std"]
# `std` enables the userland helpers of the raw layouts and bytemuck Pod
# derives. Disable it from the eBPF crate, which only needs the raw wire
# types.
std = [
    "dep:serde",
    "dep:bytemuck",
]
# Wave 4 restructure, R03 (lab PR 240): the admin protocol, the signed
# payloads, the quorum and the shutdown marker went to nn-proto with their
# dependencies (serde-big-array, ciborium, sha2, ed25519-dalek) and the
# `debug-trigger` feature. R02 (lab PR 240): the event model and the std
# types of `wire` went to nn-model, and serde_json, which only their tests
# used, with them. Lab PR 241: the exec quarantine's scanner protocol
# (`execq`) went to nn-proto, and postcard and hex, which only it used,
# with it.

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
bytemuck = { version = "1", default-features = false, features = ["derive", "min_const_generics"], optional = true }

# Kani proofs live behind cfg(kani) (Tappa 10.8); declare it so normal
# builds with -D warnings do not flag it as an unexpected cfg.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
