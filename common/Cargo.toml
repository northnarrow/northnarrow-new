[package]
name = "northnarrow-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Shared types for the NorthNarrow XDR (events, verdicts, response actions, kernel↔userland wire types)."

[lib]
name = "northnarrow_common"
path = "src/lib.rs"

[features]
default = ["std"]
# `std` enables the userland-rich types (Event, Verdict, ResponseAction)
# and bytemuck Pod derives. Disable it from the eBPF crate, which only
# needs the raw wire types.
std = [
    "dep:serde",
    "dep:bytemuck",
    "dep:postcard",
    "dep:hex",
    "dep:serde_json",
]
# Wave 4 restructure, R03 (lab PR 240): the admin protocol, the signed
# payloads, the quorum and the shutdown marker went to nn-proto with their
# dependencies (serde-big-array, ciborium, sha2, ed25519-dalek) and the
# `debug-trigger` feature.

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
bytemuck = { version = "1", default-features = false, features = ["derive", "min_const_generics"], optional = true }
postcard = { version = "1", default-features = false, features = ["alloc"], optional = true }
hex = { version = "0.4", optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
# The CBOR round-trip of `wire::TlsFingerprint` (a test; the type leaves
# with R02).
ciborium = "0.2"

# Kani proofs live behind cfg(kani) (Tappa 10.8); declare it so normal
# builds with -D warnings do not flag it as an unexpected cfg.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
