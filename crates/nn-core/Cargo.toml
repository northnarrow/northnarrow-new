[package]
name = "nn-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "NorthNarrow nn-core: detection, posture, correlation, the COMBAT and response policies, signed content, the sensor contract and the bus types (Wave 4 restructure; empty until its lot moves code in)."
publish = false

# Wave 4 restructure, R01 (lab PR 239): created empty. The crates it may
# depend on: docs/architecture/module-map.toml (xtask/tests/workspace_layers.rs).
[dependencies]
# R08a (lab PR 250): the posture, its lineage, the correlation buffer and
# the detection budget moved here; they judge `nn_model::Event`s and lock
# with parking_lot, the agent's version.
nn-model = { workspace = true }
parking_lot = "0.12"
# R07 (lab PR 247): the content lists moved here with the dependencies they
# had in the agent, the same versions (one version each in the workspace).
# `config::overlay_auth`: an overlay's SHA-256.
sha2 = "0.11"
# `config::overlay`: the loader's errors, its boot log lines, the shipped
# copies' SHA-256 in hex.
anyhow = { workspace = true }
tracing = { workspace = true }
hex = "0.4"
# `canary::templates`: the decoys' base64 shapes, the check that a JSON
# family renders a JSON document, the typed render errors. serde_json with
# the agent's feature (`float_roundtrip`), so a build of nn-core alone
# parses as the agent does.
base64 = "0.23"
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = { workspace = true }

[features]
# R08a (lab PR 250): the helpers this crate keeps for tests — its own, and
# the agent's tests and replays of the posture that wire the agent's rules
# (the agent enables it as a dev-dependency only). Nothing that changes a
# decision: readers and builders. The posture's own test-only doors (the
# legacy boolean release) stay `cfg(test)`.
test-util = []

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
