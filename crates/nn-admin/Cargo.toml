[package]
name = "nn-admin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "NorthNarrow nn-admin: the operator client's library (Wave 4 restructure; empty until its lot moves code in)."
publish = false

# Wave 4 restructure, R01 (lab PR 239): created empty. The crates it may
# depend on: docs/architecture/module-map.toml (xtask/tests/workspace_layers.rs).
[dependencies]
# R10 (lab PR 259): the agent id file's parse (`shutdown_marker`), and the
# width of the id (nn-evidence's `audit`, with the identity types).
nn-proto = { workspace = true }
nn-evidence = { workspace = true }
anyhow = { workspace = true }
# The seam the agent binds (`host`): the gate's decision on an overlay and
# the per-rule policy (nn-core), the chains' targets and boot check
# (nn-evidence), the replayed events (nn-model), the agent key's public
# half; the replay's decisions as JSON.
nn-core = { workspace = true }
nn-model = { workspace = true }
ed25519-dalek = { version = "3", default-features = false, features = ["alloc", "zeroize"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[lints]
workspace = true
