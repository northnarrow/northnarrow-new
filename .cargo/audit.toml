# RustSEC advisory policy (external audit SUP-007, NN-AUD-393).
#
# cargo-audit reads this file as `./.cargo/audit.toml`, relative to where it
# runs: run it from the repository root, as the CI audit job does
#   cargo audit --file Cargo.lock   (and fuzz/Cargo.lock, agent-ebpf/Cargo.lock)
# A vulnerability fails the run, and so do the `unsound` and `unmaintained`
# informational advisories: `[output] deny` below, and
# `--deny unsound --deny unmaintained` in ci.yml, which holds even where this
# file is not read. Nothing tracks them anywhere else (ci.yml used to say
# Dependabot did; it does not). An advisory is fixed (a lock bump, as
# memmap2 0.9.11 for RUSTSEC-2026-0186), or it gets an entry below.
#
# Every entry in `ignore` is a recorded exception with its own comment block:
#   `<ID>: <crate> <locked version>, <kind>.` and the finding, first line;
#   `Why:`       why the advisory cannot be reached here, or why no fix exists;
#   `Owner:`     who re-checks it;
#   `Re-check:`  the event that reopens it (a bump of the dependent);
#   `Recorded:`  the day it was accepted, and
#   `Expires:`   the day the CI gate stops accepting it, at most 184 days later.
# xtask/tests/supply_chain.rs checks every block, and that the crate is still
# locked at that version (a bump that moves it fails the test: drop the entry,
# or record it again). The audit job fails once an `Expires:` date has passed
# (.github/scripts/check-audit-exceptions.sh, also on the daily schedule).
# Never pass `--ignore` on the command line: an exception without its reason
# is what this file replaces.
#
# Wave 4 (lab PR 214): the exceptions RUSTSEC-2026-0253 and RUSTSEC-2026-0002
# (lru 0.12.5, through tantivy) and RUSTSEC-2024-0436 (paste 1.0.15, through
# candle and tokenizers) were dropped: those crates left both lockfiles with
# the on-host LLM advisor.
#
# Lot 398: rustls-rustcrypto 0.0.2-alpha -> 0.1.0-pre.0 dropped seven
# exceptions of lot 276's TLS provider. RUSTSEC-2026-0049, -0098, -0099,
# -0104 and -0382 (rustls-webpki 0.102.8): the provider no longer depends on
# rustls-webpki, and 0.102 left both lockfiles
# (xtask/tests/export_in_the_worker.rs: one rustls-webpki, rustls' own).
# RUSTSEC-2023-0071 (Marvin): rsa 0.10.0 is its patched release.
# RUSTSEC-2026-0387: crypto-bigint 0.7.11, patched from 0.7.6.
#
# Lot 1.6 (F11): RUSTSEC-2026-0543 (chrono 0.4.45, unmaintained; recorded
# 2026-11-17) was dropped: chrono left all three lockfiles, its timestamps
# went to jiff (crates/nn-evidence/src/time.rs, the text byte for byte).
#
# Lot M3 (OpenSSF Scorecard, Vulnerabilities): RUSTSEC-2024-0449
# (unsafe-libyaml 0.2.11, unmaintained; recorded 2026-10-20) was dropped:
# the xtask tests read YAML with serde-saphyr, a parser in safe Rust
# (xtask/tests/support/yaml.rs), and unsafe-libyaml left Cargo.lock with
# serde_yaml_ng (xtask/tests/supply_chain.rs keeps it out of all three).

[advisories]
ignore = [
    # RUSTSEC-2024-0436: paste 1.0.15, unmaintained.
    # Why: archived upstream, no fixed release; a procedural macro of rustls-rustcrypto 0.1.0-pre.0, as of 0.0.2-alpha before lot 398 (its suites' and verifiers' boilerplate): it runs at compile time only and is in no binary (it left with candle in Wave 4, lab PR 214; lot 276's TLS provider brings it back).
    #   Upstream declined pastey, the fork the advisory names, as a
    #   supply-chain risk of its own (RustCrypto/rustls-rustcrypto#101 and
    #   #104, closed; lot M3, 2026-11-26): 0.1.0-pre.0, the latest release,
    #   uses it. OpenSSF Scorecard counts it (Vulnerabilities, OSV) until then.
    # Owner: the maintainer.
    # Re-check: a rustls-rustcrypto release without it
    # Recorded: 2026-11-03
    # Expires: 2027-05-03
    "RUSTSEC-2024-0436",
]

[output]
# A local `cargo audit` gives the CI verdict.
deny = ["unsound", "unmaintained"]
quiet = false
