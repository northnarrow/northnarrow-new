[alias]
xtask = "run --quiet --package xtask --release --"

# Wave 4 restructure, R00 (lab PR 239): the repository root, absolute, for
# the files a crate embeds or reads from outside itself
# (`include_str!(concat!(env!("NN_REPO_ROOT"), "/configs/…"))`). A path
# relative to the including file (`../../../configs/…`) or to the crate
# (`CARGO_MANIFEST_DIR/..`) breaks when the file moves to another crate or
# another depth; this one does not, so a `move(…)` commit stays a move.
# `relative = true`: relative to the directory holding `.cargo/`. Cargo
# finds this file from the working directory, so every build of the tree
# runs from inside it (CI, xtask, the lab, the fuzz harness); xtask's own
# tests keep `CARGO_MANIFEST_DIR` (xtask lives at the root by definition).
# xtask/tests/path_liveness.rs refuses a depth-relative path in a member.
[env]
NN_REPO_ROOT = { value = ".", relative = true }

# External audit SUP-017: the repository default is x86-64-v2 (SSE4.2,
# POPCNT; every x86_64 server since 2009 and every CI runner), the ISA the
# release ships. It was target-cpu=native (Sub-tappa 6.8, for the CPU
# kernels of the on-host LLM advisor, removed in Wave 4), which ties a
# binary to the build host or newer: a release built on an AVX-512 runner
# died with SIGILL elsewhere (review 64), and any other build copied to
# another host could do the same (`cargo xtask build --release`,
# `--profile release-bench`, the lab and range builds). The release
# workflow also sets x86-64-v2 explicitly and starts the binaries on a
# Nehalem CPU under qemu.
#
# A build that runs only on the host that compiles it can opt into native
# for the x86_64 target only, so the eBPF build keeps its own flags;
# `cargo xtask build` passes the variable on to the nested build
# (review 65):
#   CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS="-C target-cpu=native" cargo xtask build --release
# Never ship such a binary to another host.
#
# `lld` would shave a few seconds off link time but is not available
# on the production host (Hetzner CCX23, May 2026); leaving the
# default linker keeps `cargo build --release` self-contained.
[build]
rustflags = ["-C", "target-cpu=x86-64-v2"]
