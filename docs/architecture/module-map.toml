# The Wave 4 restructure's layout: the crates, which of them each may
# depend on, and the crate each module of `agent/src` and `common/src` is
# headed for. Plan: w4-restructure-plan (§2.1 layers, §2.4 module map,
# §4 lots R00–R17); this file is its versioned half, read by two tests:
#
# - xtask/tests/module_map.rs, the ratchet (R00, lab PR 239): every source
#   file of `agent/src` and `common/src` is mapped; a reference from a
#   module to a module of a crate its own crate may not depend on
#   (`allowed` below) is a violation; the violations of each crate may not
#   go above `[ratchet]`, and when they go down `[ratchet]` goes down with
#   them. A module moves to its crate when it has none left (rule 3 of §4.1).
# - xtask/tests/workspace_layers.rs, the gate (R01, lab PR 239): the real
#   dependency graph of the workspace (`cargo metadata`) against `allowed`,
#   no cycle, and the rules of the pure crates.
#
# The format is the TOML subset xtask/tests/support/mod.rs reads: `[a.b]`
# headers, `key = "string" | true | false | integer | ["list", …]`.

[map]
format = "northnarrow-module-map/1"

# ── crates ───────────────────────────────────────────────────────────────
# `allowed`: the crates of this repository it may depend on (normal, build
# or dev dependency alike). `pure`: no OS interface (no libc, nix, rustix,
# aya, procfs, tokio, no `std::os`, no `cfg(target_os)`/`cfg(unix)`),
# built for the non-Linux targets by the CI job `portable-core`.
# `forbid_unsafe`: `#![forbid(unsafe_code)]` at the crate root. `planned`:
# not a workspace member yet (R01, lab PR 239, created nn-parse, nn-model,
# nn-proto, nn-evidence, nn-core, nn-linux and nn-admin, empty; nn-export
# and nn-server come with R15 and R16). Bottom up, as §2.1 draws them.

[crates.northnarrow-common]
about = "nn-wire: the kernel/userland ABI (no_std raw layouts, btf_offsets, ring_drops); its std half leaves in R02/R03 (R03, lab PR 240: the admin modules to nn-proto, atomic_file and sd_notify to antitamper-bpf)"
allowed = []
forbid_unsafe = true
planned = false

[crates.nn-parse]
about = "parsers of hostile bytes (TLS ClientHello, DNS records, QNAME); a leaf, fuzzed, run in the worker (R06, R14b)"
allowed = []
pure = true
forbid_unsafe = true
planned = false

[crates.nn-model]
about = "the vocabulary: Event, verdicts, actions and outcomes, ProcessKey, PostureKind, log_escape, netaddr, OCSF (R02)"
allowed = ["northnarrow-common", "nn-parse"]
pure = true
forbid_unsafe = true
planned = false

[crates.nn-proto]
about = "the admin protocol, signed payloads, quorum, shutdown marker, watchdog hold, core/worker IPC (R03)"
allowed = ["northnarrow-common", "nn-parse", "nn-model"]
pure = true
forbid_unsafe = true
planned = false

[crates.nn-evidence]
about = "signed chains behind a Signer trait: canonical form, RowSeq, heads, verification, payloads; no key (R05)"
allowed = ["northnarrow-common", "nn-parse", "nn-model"]
pure = true
forbid_unsafe = true
planned = false

[crates.nn-core]
about = "detection, posture, correlation, COMBAT and response policy, signed content, sensor contract, bus types; no OS call, no tokio (R07, R08)"
allowed = ["northnarrow-common", "nn-parse", "nn-model", "nn-proto", "nn-evidence"]
pure = true
forbid_unsafe = true
planned = false

[crates.northnarrow-antitamper-bpf]
about = "the Linux base shared with the watchdog: bpffs pins, LSM attach, sd_notify, atomic_file (R03, lab PR 240)"
allowed = ["northnarrow-common", "nn-model", "nn-proto"]
planned = false

[crates.northnarrow-scan]
about = "the exec quarantine's confined scanner (lab PR 223, after the plan): a worker-like process the agent spawns"
allowed = ["northnarrow-common", "nn-parse", "nn-model", "nn-proto"]
planned = false

[crates.ebpf-guard]
about = "the eBPF object's provenance stamp (xtask writes it, the agent's build script checks it)"
allowed = []
planned = false

[crates.nn-linux]
about = "the adapters: eBPF loader and sensors, /proc, actuators, self-defence, systemd, KeyStore, sandbox (R09)"
allowed = ["northnarrow-common", "nn-parse", "nn-model", "nn-proto", "nn-evidence", "nn-core", "northnarrow-antitamper-bpf", "northnarrow-scan", "ebpf-guard"]
planned = false

[crates.nn-export]
about = "the export worker: WAL, OCSF, OTLP/syslog with an at-least-once cursor (R15)"
allowed = ["northnarrow-common", "nn-parse", "nn-model", "nn-proto", "nn-evidence", "nn-core"]
planned = true

[crates.nn-admin]
about = "the operator client's library; the nn-admin binary stays a shim of the agent package (R10)"
allowed = ["northnarrow-common", "nn-parse", "nn-model", "nn-proto", "nn-evidence", "nn-core"]
forbid_unsafe = true
planned = false

[crates.northnarrow-agent]
about = "nn-agent: the composition (typed boot phases, bus and pipeline, admin server, supervisor, worker entry)"
allowed = ["northnarrow-common", "nn-parse", "nn-model", "nn-proto", "nn-evidence", "nn-core", "nn-linux", "northnarrow-antitamper-bpf", "northnarrow-scan", "nn-export", "nn-admin", "ebpf-guard"]
planned = false

[crates.northnarrow-watchdog]
about = "nn-watchdog: the pidfd supervisor; never the engine"
allowed = ["northnarrow-common", "nn-model", "nn-proto", "northnarrow-antitamper-bpf"]
planned = false

[crates.nn-server]
about = "the backend (evidence gateway, then Director/TUF/SIEM); never linked into the agent (R16)"
allowed = ["northnarrow-common", "nn-parse", "nn-model", "nn-proto", "nn-evidence"]
planned = true

[crates.xtask]
about = "the workspace's task runner"
allowed = ["ebpf-guard"]
planned = false

[crates.northnarrow-cli]
about = "the CLI stub, removed in R17"
allowed = []
forbid_unsafe = true
planned = false

# ── agent/src: module → crate (§2.4) ─────────────────────────────────────
# A file takes the entry of its longest module prefix (`fim::drain`, else
# `fim`). A file that will be split (R04c) is mapped where the plan sends
# most of it; the comment says which part goes elsewhere. Modules added
# after the plan (lab PRs 214–238) are marked "post-plan": mapped by lab
# PR 239 on the plan's principles, to be confirmed by the lot that moves
# them.

[modules.agent]
"lib" = "northnarrow-agent"
"main" = "northnarrow-agent"
"bin::nn_admin" = "nn-admin"
"admin_cli" = "nn-admin"
"admin_socket" = "northnarrow-agent"
"agent_id" = "nn-linux"
# the Linux host's anchor of a log's directory (`/proc/self/fd`), behind
# `chain_host::ChainHost::anchor`: not moved to nn-evidence with the chains
# (R05, lab PR 241)
"anchored" = "nn-linux"
"anti_tamper" = "nn-linux"
# the role parse and the UnlockToken verification; key loading stays Linux
"anti_tamper::admin_auth" = "nn-proto"
"async_fd" = "nn-linux"
"atomic_file" = "nn-linux"
# post-plan (lab PR 241, R04a): the audit log's writability before the
# attach (`access(2)`), from `audit`
"audit_preflight" = "nn-linux"
# post-plan (lab PR 218): typed boot phases, as main's boot/* of R11a
"boot" = "northnarrow-agent"
# post-plan (lab PR 217): an external command with a deadline
"bounded_cmd" = "nn-linux"
# post-plan (lab PR 241, R04a): the binary's version, cargo features and BPF
# guard mode, from `audit` (a `cfg!(feature)` is read in the agent, §4.1
# rule 4)
"build_info" = "northnarrow-agent"
# path_policy, the registry's store, network, access_log, read_forward
"canary" = "nn-linux"
"canary::detector" = "nn-core"
# judges on `posture::lineage` (R08a)
"canary::readers" = "nn-core"
# the format half goes to nn-core (R04c)
"canary::registry" = "nn-linux"
# post-plan (lab PR 241, R04a): the chains' Linux file operations
"chain_host_linux" = "nn-linux"
# post-plan (lab PR 241, R04a): the agent's chains — their paths (one is
# the admin socket's), the payload of each rotating log, the canary chains'
# full checks, the anchoring and boot-verify tasks — from `chain_anchor`.
# nn-admin's `chain verify` reads the list: two nn-admin references until
# the payloads have a crate below it (plan R04a/R05 "i payload"; R10)
"chains" = "northnarrow-agent"
# the ladder and its evidence; SystemActuator and the probes of protected
# and reconcile go to nn-linux (R04c)
"combat" = "nn-core"
# comm_allowlist, overlay_auth (verify), overlay_floor. R07 (lab PR 247):
# `overlay` (the loader) and the part of `overlay_auth` the loaders take
# moved to nn-core (`[shims.agent]`), `config/mod.rs` binding them to the
# agent's host; comm_allowlist judges on `posture::lineage` and holds a kill
# through `decision::response_policy` (R08); the gate verifies through
# `anti_tamper::admin_auth` (nn-proto, after R04b) and the floor reads the
# agent's key (`keys`): they move when those are below nn-core (§4.1 rule 3)
"config" = "nn-core"
# R04c (lab PR 247, with R07): overlay_auth's install half (`config overlay
# set`'s atomic write and the new inodes' protection)
"config::overlay_install" = "nn-linux"
# post-plan (lab PR 247, R07): the Linux host of nn-core's content lists
# (`content_host::ContentHost`: the open that follows no symlink and blocks
# on no FIFO)
"content_host_linux" = "nn-linux"
# post-plan (lab PR 222): copy on first write; fanotify, copies, journal
"cow" = "nn-linux"
"cow::config" = "nn-core"
"cow::index" = "nn-core"
"cow::trust" = "nn-core"
"decision" = "nn-core"
"detection_budget" = "nn-core"
# post-plan (lab PR 241, R04a): the detection log's records and their
# parts, from `detection_store` (plan R04a: "i tipi dei payload vanno in
# file propri"; the payloads are nn-evidence's)
"detection_payload" = "nn-evidence"
# not in §2.4: the detection sink's queue and files, the records'
# constructors from the engine's decisions (its payloads: above, R04a)
"detection_store" = "nn-linux"
# post-plan (lab PR 226): exec policy; the controller and the kernel maps
"execpol" = "nn-linux"
"execpol::policy" = "nn-core"
"execpol::record" = "nn-core"
# post-plan (lab PR 223): exec quarantine; controller, kernel, package trust
"execq" = "nn-linux"
"execq::policy" = "nn-core"
"execq::record" = "nn-core"
# attach, drain (the ring half; the drift classification → nn-core, R04c),
# baseline, honeypot, recompute
"fim" = "nn-linux"
"fim::rules" = "nn-core"
"fs_type" = "nn-linux"
# into the crates it exercises in R17
"fuzz_api" = "northnarrow-agent"
"host_hardening" = "nn-linux"
# post-plan (lab PR 225): the ransomware signal (sampler behind a trait)
"impact" = "nn-core"
# post-plan (lab PR 225): defences switched off, a shipped list
"impair" = "nn-core"
"install_manifest" = "nn-linux"
# the agent's signing key and its files, from `audit` (plan R04a; nn-linux's
# `keys`, R09a)
"keys" = "nn-linux"
# post-plan (lab PR 216): the event loop's progress, for the watchdog
"loop_progress" = "northnarrow-agent"
# flow_tracker, dns_cache (the state; its reply parser went to nn-parse's
# dns_records in R06, lab PR 242), limiter, blocklist (its loaders read the
# shipped `.v1` through the host: they move with the decision replay that
# calls them, R08b; lab PR 247 sent its inactive-rules report, which reads
# the resolver's configuration, to `net::blind_spots`)
"net" = "nn-core"
"net::blind_spots" = "nn-linux"
"net::drain" = "nn-linux"
# post-plan (lab PR 224): the host's resolv.conf
"net::resolvers" = "nn-linux"
# R06 (lab PR 242): net::tls_parser moved to nn-parse (`tls`); the agent
# re-exports it as `net::tls_parser` until R17, a `pub use` in `net`.
# post-plan (lab PR 234): the OS CSPRNG
"os_rng" = "nn-linux"
"posture" = "nn-core"
# post-plan (lab PR 216): no core dump, no readable memory
"process_hardening" = "nn-linux"
# post-plan (lab PR 214): settings of the removed LLM advisor, named at boot
"removed_settings" = "northnarrow-agent"
# the actuators and the Executor; ExecutionOutcome/Report → nn-model (R04a)
"response" = "nn-linux"
"response::config" = "nn-core"
"runtime" = "nn-linux"
"sd_notify" = "nn-linux"
"self_integrity" = "nn-linux"
"sensor_feasibility" = "nn-linux"
"sensors" = "nn-linux"
# the file I/O; the marker's format is nn-proto's (R03, lab PR 240)
"shutdown_marker" = "nn-linux"
"systemd_state" = "nn-linux"
"telemetry_probe" = "nn-linux"
"trusted_bin" = "nn-linux"
# post-plan (lab PR 220): the signed record of a rolled-back upgrade
"upgrade_rollback" = "nn-linux"
# post-plan (lab only): `--verifier-check`
"verifier_check" = "nn-linux"

# ── agent/src: the shims of R05, R07 and R08a ─────────────────────────
# R05 (lab PR 241): these modules moved to nn-evidence. The agent keeps
# their paths, without a file, in `lib.rs` and `canary/mod.rs` (plan §4.1
# rule 2: `pub use nn_evidence::…`; the writers' aliases with the agent's
# key as default and the key's names under `audit`; removed in R17). A
# reference to one counts for nn-evidence. R07 (lab PR 247): content
# modules moved to nn-core, their paths kept the same way in their
# parent's `mod.rs`; a reference to one counts for nn-core. R08a (lab PR
# 250): the open sensor's path text moved to nn-model first (the posture
# reads it: §4.1 rule 3), then the posture, its lineage, the correlation
# buffer and the detection budget to nn-core, the same way.

[shims.agent]
# R07 (lab PR 247): the COMBAT carve-out
"anti_tamper::combat_allow" = "nn-core"
"audit" = "nn-evidence"
# post-plan (lab PR 178): the one reader of the canary chains' lines
"canary::chain_lines" = "nn-evidence"
# R07 (lab PR 247): the credential renderer; `canary/mod.rs` binds it to the
# agent's host and draws the deploy's seed from the OS RNG
"canary::templates" = "nn-core"
"chain_anchor" = "nn-evidence"
# post-plan (lab PR 241, R04a): what the chains need from their host (the
# signer; the file operations)
"chain_host" = "nn-evidence"
"chain_tail" = "nn-evidence"
"chainlog" = "nn-evidence"
# R08a (lab PR 250): the buffer of recent events the triggers read
"correlation" = "nn-core"
# R07 (lab PR 247): the `.v1` + `.local` list loader; `config/mod.rs`
# binds its reading loaders to the agent's host
"config::overlay" = "nn-core"
# R07 (lab PR 247): the FIM watched paths; `fim/mod.rs` binds the loader
"fim::paths_config" = "nn-core"
# R08a (lab PR 250): the text of the open sensor's paths (post-plan, lab PR
# 241, R04b: from `sensors::open_sensor`), the event's vocabulary
"path_text" = "nn-model"
"verify_lines" = "nn-evidence"

# ── common/src: module → crate (§2.4) ────────────────────────────────────

[modules.common]
"lib" = "northnarrow-common"
# raw layouts and constants; the std types of wire/mod.rs (FimEvent,
# NetFlowEvent, NetListenerEvent, TlsFingerprint, …) went to nn-model's
# `telemetry` (R02, lab PR 240)
"wire" = "northnarrow-common"
# post-plan (lab PR 215): uapi bpf_cmd numbers, shared with the eBPF object
"bpf_cmd" = "northnarrow-common"
"btf_offsets" = "northnarrow-common"
# post-plan (lab PR 219): the decision model the eBPF programs run
"epg" = "northnarrow-common"
# post-plan (lab PR 215): the deny hooks' fail-open counters
"fail_open" = "northnarrow-common"
"ring_drops" = "northnarrow-common"
# R03 (lab PR 240) moved wire::admin_protocol, wire::admin_signed_payload,
# admin_quorum, shutdown_marker and watchdog_hold to nn-proto, atomic_file
# and sd_notify to northnarrow-antitamper-bpf; R02 (lab PR 240) model,
# posture_types, netaddr, log_escape (and the std types of wire) to
# nn-model, dns_qname to nn-parse: a member's own sources, out of this scan
# (the layer gate checks its dependencies). Lab PR 241: execq (post-plan, lab
# PR 223: the agent ↔ scanner protocol and hash list) to nn-proto.

# `[aliases.<tree>]`: the items of a tree's root and the modules that define
# them, `*` for any other item. common's (`pub use model::*`, `pub use
# dns_qname::{…}`) left with R02 (lab PR 240): its root holds modules only.

# ── the ratchet ──────────────────────────────────────────────────────────
# The references, per crate of the referring module, to a crate it may not
# depend on (distinct (file, module) pairs, outside tests and Kani
# proofs). They may only go down: xtask/tests/module_map.rs fails above
# these numbers and asks for the lower number below them. R04 brings
# nn-evidence and nn-core to 0. Lab PR 241: 77 → 54 (nn-evidence 0; nn-core
# 40, the rest R04b's and R04c's). Lab PR 247 (R07): 54 → 52, nn-core
# 40 → 38. The content code's two reads went behind the host seam and named
# the agent's Linux host where they had called libc (→ 43); overlay_auth's
# install half left for nn-linux (→ 42), and it names the exec profile in
# `execpol::policy`, where it is defined (→ 41); the inactive network rules
# (the resolver's DNS over TLS) left the blocklist for `net::blind_spots`
# (→ 40); the moved list loader no longer names the host, `config/mod.rs`,
# which binds it, does (40); the canary renderer moved and the OS RNG of its
# seed stayed in the agent (→ 38). The two left of R07's: `config/mod.rs`
# and the gate in `config/overlay_auth.rs` name `chain_host_linux`.

[ratchet]
nn-admin = 8
nn-core = 38
nn-evidence = 0
nn-linux = 3
nn-proto = 3
