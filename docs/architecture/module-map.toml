# ── the ratchet ──────────────────────────────────────────────────────────
# The references, per crate of the referring module, to a crate it may not
# depend on (distinct (file, module) pairs, outside tests and Kani
# proofs). They may only go down: xtask/tests/module_map.rs fails above
# these numbers and asks for the lower number below them. R04 brings
# nn-evidence and nn-core to 0. Lab PR 241: 77 → 54 (nn-evidence 0; nn-core
# 40, the rest R04b's and R04c's). Lab PR 247 (R07): 54 → 52, nn-core
# 40 → 38. The content code's two reads went behind the host seam and named
# the agent's Linux host where they had called libc (→ 43); overlay_auth's
# install half left for nn-linux (→ 42), and it names the exec profile in
# `execpol::policy`, where it is defined (→ 41); the inactive network rules
# (the resolver's DNS over TLS) left the blocklist for `net::blind_spots`
# (→ 40); the moved list loader no longer names the host, `config/mod.rs`,
# which binds it, does (40); the canary renderer moved and the OS RNG of its
