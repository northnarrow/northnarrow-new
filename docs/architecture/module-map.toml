# The Wave 4 restructure's layout: the crates, which of them each may
# depend on, and the crate each module of `agent/src` and `common/src` is
# headed for. Plan: w4-restructure-plan (§2.1 layers, §2.4 module map,
# §4 lots R00–R17); this file is its versioned half, read by two tests:
#
# - xtask/tests/module_map.rs, the ratchet (R00, lab PR 239): every source
#   file of `agent/src` and `common/src` is mapped; a reference from a
#   module to a module of a crate its own crate may not depend on
#   (`allowed` below) is a violation; the violations of each crate may not
#   go above `[ratchet]`, and when they go down `[ratchet]` goes down with
#   them. A module moves to its crate when it has none left (rule 3 of §4.1).
# - xtask/tests/workspace_layers.rs, the gate (R01, lab PR 239): the real
#   dependency graph of the workspace (`cargo metadata`) against `allowed`,
#   no cycle, and the rules of the pure crates.
#
# The format is the TOML subset xtask/tests/support/mod.rs reads: `[a.b]`
# headers, `key = "string" | true | false | integer | ["list", …]`.

[map]
format = "northnarrow-module-map/1"

# ── crates ───────────────────────────────────────────────────────────────
# `allowed`: the crates of this repository it may depend on (normal, build
# or dev dependency alike). `pure`: no OS interface (no libc, nix, rustix,
# aya, procfs, tokio, no `std::os`, no `cfg(target_os)`/`cfg(unix)`),
# built for the non-Linux targets by the CI job `portable-core`.
# `forbid_unsafe`: `#![forbid(unsafe_code)]` at the crate root. `planned`:
# not a workspace member yet (R01, lab PR 239, created nn-parse, nn-model,
# nn-proto, nn-evidence, nn-core, nn-linux and nn-admin, empty; nn-export
# and nn-server come with R15 and R16). Bottom up, as §2.1 draws them.

[crates.northnarrow-common]
about = "nn-wire: the kernel/userland ABI (no_std raw layouts, btf_offsets, ring_drops); its std half leaves in R02/R03 (R03, lab PR 240: the admin modules to nn-proto, atomic_file and sd_notify to antitamper-bpf)"
allowed = []
forbid_unsafe = true
planned = false

[crates.nn-parse]
about = "parsers of hostile bytes (TLS ClientHello, DNS records, QNAME); a leaf, fuzzed, run in the worker (R06, R14b)"
allowed = []
pure = true
forbid_unsafe = true
planned = false

[crates.nn-model]
about = "the vocabulary: Event, verdicts, actions and outcomes, ProcessKey, PostureKind, log_escape, netaddr, OCSF (R02); nn-parse's QNAME walk left it with the DNS record's decode for nn-linux's sensor (R09b, lab PR 254)"
allowed = ["northnarrow-common"]
pure = true
forbid_unsafe = true
planned = false

[crates.nn-proto]
about = "the admin protocol, signed payloads, quorum, shutdown marker, watchdog hold, core/worker IPC (R03)"
allowed = ["northnarrow-common", "nn-parse", "nn-model"]
pure = true
forbid_unsafe = true
planned = false

[crates.nn-evidence]
about = "signed chains behind a Signer trait: canonical form, RowSeq, heads, verification, payloads; no key (R05)"
allowed = ["northnarrow-common", "nn-parse", "nn-model"]
pure = true
forbid_unsafe = true
planned = false

[crates.nn-core]
about = "detection, posture, correlation, COMBAT and response policy, signed content, sensor contract, bus types; no OS call, no tokio (R07, R08)"
allowed = ["northnarrow-common", "nn-parse", "nn-model", "nn-proto", "nn-evidence"]
pure = true
forbid_unsafe = true
planned = false

[crates.northnarrow-antitamper-bpf]
about = "the Linux base shared with the watchdog: bpffs pins, LSM attach, sd_notify, atomic_file (R03, lab PR 240)"
allowed = ["northnarrow-common", "nn-model", "nn-proto"]
planned = false

[crates.northnarrow-scan]
about = "the exec quarantine's confined scanner (lab PR 223, after the plan): a worker-like process the agent spawns"
allowed = ["northnarrow-common", "nn-parse", "nn-model", "nn-proto"]
planned = false

[crates.ebpf-guard]
about = "the eBPF object's provenance stamp (xtask writes it, the agent's build script checks it)"
allowed = []
planned = false

[crates.nn-linux]
about = "the adapters: eBPF loader and sensors, /proc, actuators, self-defence, systemd, KeyStore, sandbox (R09)"
allowed = ["northnarrow-common", "nn-parse", "nn-model", "nn-proto", "nn-evidence", "nn-core", "northnarrow-antitamper-bpf", "northnarrow-scan", "ebpf-guard"]
planned = false

[crates.nn-export]
about = "the export worker: WAL, OCSF, OTLP/syslog with an at-least-once cursor (R15)"
allowed = ["northnarrow-common", "nn-parse", "nn-model", "nn-proto", "nn-evidence", "nn-core"]
planned = true

[crates.nn-admin]
about = "the operator client (R10, lab PR 259: admin_cli and the command line, from the agent): what it reads of the Linux host and of the agent goes through its `host::AdminHost`, which the agent implements — no arc to nn-linux, the plan's §2.1 and the decision lab PR 239 left to R10; the nn-admin binary stays a shim of the agent package"
allowed = ["northnarrow-common", "nn-parse", "nn-model", "nn-proto", "nn-evidence", "nn-core"]
forbid_unsafe = true
planned = false

[crates.northnarrow-agent]
about = "nn-agent: the composition (typed boot phases, bus and pipeline, admin server, supervisor, worker entry)"
allowed = ["northnarrow-common", "nn-parse", "nn-model", "nn-proto", "nn-evidence", "nn-core", "nn-linux", "northnarrow-antitamper-bpf", "northnarrow-scan", "nn-export", "nn-admin", "ebpf-guard"]
planned = false

[crates.northnarrow-watchdog]
about = "nn-watchdog: the pidfd supervisor; never the engine"
allowed = ["northnarrow-common", "nn-model", "nn-proto", "northnarrow-antitamper-bpf"]
planned = false

[crates.nn-server]
about = "the backend (evidence gateway, then Director/TUF/SIEM); never linked into the agent (R16)"
allowed = ["northnarrow-common", "nn-parse", "nn-model", "nn-proto", "nn-evidence"]
planned = true

[crates.xtask]
about = "the workspace's task runner"
allowed = ["ebpf-guard"]
planned = false

[crates.northnarrow-cli]
about = "the CLI stub, removed in R17"
allowed = []
forbid_unsafe = true
planned = false

# ── agent/src: module → crate (§2.4) ─────────────────────────────────────
# A file takes the entry of its longest module prefix (`fim::drain`, else
# `fim`). A file that will be split (R04c) is mapped where the plan sends
# most of it; the comment says which part goes elsewhere. Modules added
# after the plan (lab PRs 214–238) are marked "post-plan": mapped by lab
# PR 239 on the plan's principles, to be confirmed by the lot that moves
# them.

[modules.agent]
"lib" = "northnarrow-agent"
# R11a (lab PR 261): the binary's root, the shim that runs the library's
# start (`boot::main`)
"main" = "northnarrow-agent"
# R10 (lab PR 259): the binary's logic moved to nn-admin (its `cli`); the
# root left here is the agent package's shim, which passes the agent's host
# (`admin_host`) to nn-admin's `main`: the composition
"bin::nn_admin" = "northnarrow-agent"
# post-plan (lab PR 259, R10): nn-admin on the agent's host — the agent's
# implementation of nn-admin's `host::AdminHost` (the hardening checks, the
# agent key's files, its chains and where they lie under its state
# directory, the overlay gate and its rollback floor, the loaders' checks,
# the offline engine on the Linux host), which the `nn-admin` binary passes
# to nn-admin: the composition, as `chains`
"admin_host" = "northnarrow-agent"
"admin_socket" = "northnarrow-agent"
# post-plan (lab PR 218): typed boot phases, as main's boot/* of R11a.
# R09b (lab PR 254): the phases, the attach permit the sensors' attach
# takes, the degradations of a run (`boot::degradation`, `[shims.agent]`)
# and the sensors' attach points went to nn-linux, which the sensors
# report to; the deny self-test, the BPF LSM gate, the trust level and the
# signed manifest stay. R09c (lab PR 257): they still do — the plan gives
