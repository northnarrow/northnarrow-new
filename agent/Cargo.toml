[package]
name = "northnarrow-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "NorthNarrow agent daemon (Linux-first, 100% Rust XDR sensor + responder)."

[[bin]]
name = "northnarrow-agent"
path = "src/main.rs"

[[bin]]
name = "nn-admin"
path = "src/bin/nn_admin.rs"

[lib]
name = "northnarrow_agent"
path = "src/lib.rs"

[[example]]
name = "posture_demo"
required-features = ["posture-demo"]

# Lab PR 221: the generator of docs/detection/ behind `cargo xtask
# attack-coverage`; its tests (the pinned-id extraction) run with the
# workspace's.
[[example]]
name = "attack_coverage"
test = true

[features]
default = []
# Enables R901..=R904, four hardcoded demo rules whose only job is to
# trigger each of the new Tappa 5 actions (BlockOutbound,
# FullNetworkIsolation, Quarantine, ThrottleProcess) by filename
# suffix. NEVER enable in production builds.
demo-tappa5 = []
# Exposes the nn-admin `debug --force-posture <STATE>` subcommand and
# the agent-side handler that consumes it. Used by the integration
# test harness; never enabled in production builds.
debug-trigger = ["nn-proto/debug-trigger"]
# Gates `agent/tests/privileged_e2e.rs` — full end-to-end scenarios
# that spawn the agent + nn-admin subprocesses and verify the
# iptables ruleset against a live kernel. Requires root and a
# working iptables binary; CI compiles but does not execute these.
# See docs/integration-test-runbook.md for the manual run path.
test-privileged = []
# Builds `examples/posture_demo.rs` (`required-features`). External audit
# POS-013 made it compile `PostureMachine::admin_release_combat`, the
# Sub-tappa 6.5 bool stub that leaves COMBAT without a signed token, for
# the demo; WDG-R02 (NN-AUD-368) made the stub a `#[cfg(test)]` helper and
# the demo no longer calls it, so this feature compiles nothing into the
# library or the binaries. Never enabled in production builds.
posture-demo = []

[dependencies]
common = { workspace = true }
# Wave 4 restructure, R03 (lab PR 240): the admin protocol, the signed
# payloads, the quorum, the shutdown marker and the watchdog hold.
nn-proto = { workspace = true }
# R02 (lab PR 240): the event model, the posture types, the network
# addresses, log escaping and the decoded telemetry records (nn-model); the
# QNAME walk (nn-parse).
nn-model = { workspace = true }
nn-parse = { workspace = true }
# R05 (lab PR 241): the evidence chain (chainlog, audit, chain_anchor,
# chain_tail, verify_lines, the canary chain line reader), named through
# the shims of the same modules here.
nn-evidence = { workspace = true }
# ISSUE_002: shared aya-handling primitives (bpffs pin paths, LSM
# hook attach/reuse, /proc helpers). Watchdog binary consumes this
# crate directly without pulling the rest of `agent` —
# anti_tamper/mod.rs re-exports its public surface so existing
# in-agent callers compile byte-identically.
antitamper-bpf = { workspace = true }
# Lab PR 223 (EXPERIMENTAL exec quarantine): the agent's end of the scanner
# channel (SCM_RIGHTS, the supervisor of the child process). The scanner's
# engine runs in its own confined process; the agent's tests also run it in
# process.
northnarrow-scan = { path = "../scan" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
bytemuck = { workspace = true }
aya = { workspace = true }
libc = "0.2"
nix = { version = "0.31", features = ["signal", "process"] }
procfs = { version = "0.18", default-features = false }

# Tappa 5: response executors
# Lab PR 234: the RustCrypto generation (aes-gcm 0.11, hkdf/hmac 0.13,
# sha2 0.11, md-5 0.11, ed25519-dalek 3, rand 0.10) moves together, in
# every crate of the workspace and in fuzz/Cargo.lock: one copy of
# digest, crypto-common and rand_core. The vault, Ed25519, SHA-256 and
# MD5 bytes are pinned by `cargo test crypto_vectors` (lab PR 230).
aes-gcm = "0.11"
hkdf = "0.13"
sha2 = "0.11"
# Tappa 10 (N5): JA3 TLS fingerprint hashing. MD5 here is a
# threat-intel fingerprint compatibility primitive (JA3 spec,
# Salesforce 2017 / RFC-equivalent), NOT a cryptographic
# security primitive — JA3 hashes a known short input to dedupe
# fingerprints across hosts. Collision-resistance brokenness
# (Wang 2004) is irrelevant for this use case.
# Sourced from RustCrypto (same maintainer org as the already-
# trusted sha2 + ed25519-dalek + curve25519-dalek deps above) so
# the workspace's "crypto deps under a single trusted maintainer"
# invariant holds. R06 (lab PR 242): JA3 left with the ClientHello parser
# for nn-parse; the agent's own MD5 is the exec quarantine's RPM file
# digests (execq/pkgtrust).
md-5 = "0.11"
rand = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
# External audit EVD-007 (lab PR 204): `float_roundtrip` parses a float to
# the exact value written. The chain verifiers re-serialise each decoded row
# and hash it; the default parser can land one ULP off a 17-digit float (a
# detection's `confidence`, an f64 in an audit row's `extra`),
# so such a row did not verify, and a v3 row would also fail its canonical
# check (`chainlog::tests::every_shipped_payload_type_round_trips_byte_exactly`).
serde_json = { version = "1", features = ["float_roundtrip"] }

# chrono: the evidence logs' UTC timestamps; clap: the command lines;
# parking_lot: the agent's locks. (They came with Tappa 6, the on-host LLM
# advisor removed in Wave 4, lab PR 214, and stayed with the rest.)
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }
clap = { workspace = true }
parking_lot = "0.12"

# The evidence logs' signatures (`agent_sig`) are base64 in their JSONL
# lines; the canary templates render base64-shaped secrets.
base64 = "0.23"

# Tappa 7 task 7 / Tappa 8: nn-admin Ed25519 challenge-response.
# Lab PR 234: ed25519-dalek 3 has no `std` feature; `alloc` is what it
# left. `rand_core` lets the OS CSPRNG (`os_rng::OsRng`, getrandom, over
# rand 0.10's `SysRng`) feed key generation.
ed25519-dalek = { version = "3", default-features = false, features = ["alloc", "rand_core", "zeroize"] }
hex = "0.4"

[build-dependencies]
# Staleness guard: build.rs verifies the embedded eBPF `.o` was built
# from the current source (matches the xtask-written stamp) and refuses
# to embed a stale one. Shared crate so the hash matches xtask's writer
# byte-for-byte.
ebpf-guard = { path = "../ebpf-guard" }

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
# Lab PR 219: parse the embedded eBPF object in unit tests, with the parser
# aya 0.14.0 itself runs: every map must be of a type aya 0.14 loads (a
# task-storage map parsed and still stopped the agent), and the exploit
# guard's maps and programs. Already in the tree through aya (lab PR 231:
# 0.2.1 → 0.3.0 with aya 0.14).
aya-obj = "=0.3.0"

# Kani proofs live behind cfg(kani) (Tappa 10.8); declare it so normal
# builds with -D warnings do not flag it as an unexpected cfg.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

# External audit SUP-015: clippy reads `rust-version`, which became true
# (1.89, was 1.83). `u*::is_multiple_of` is stable since 1.87, so clippy
# now asks for it at eleven `x % n == 0` sites of the agent. The rewrite
# is behaviour-neutral for the non-zero constant divisors used there and
# is left to its own change (the audit lots editing the agent run in
# parallel); until then the lint stays off for this crate only.
[lints.clippy]
manual_is_multiple_of = "allow"
